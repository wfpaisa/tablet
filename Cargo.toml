[workspace]
resolver = "2"
members = ["crates/tablet-config", "crates/tabletd", "crates/tablet-center"]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tablet-config = { path = "crates/tablet-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
